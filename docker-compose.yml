services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: wms-qdrant
    # 仅监听本地，不暴露到公网
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wms-ai-service:
    build:
      context: ./wms-ai-service
    container_name: wms-ai-service
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      QDRANT_URL: http://qdrant:6333
      WMS_BACKEND_URL: http://host.docker.internal:8080
      WMS_UPLOAD_ROOT: /app/uploads
      # 生产环境必须配置随机token
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
    volumes:
      - ./wms-backend/uploads:/app/uploads
    depends_on:
      - qdrant
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qdrant_data:
