# ============================================================
# Docker 环境配置 - 所有参数通过环境变量注入
# 启动时指定: --spring.profiles.active=docker
# ============================================================

spring.application.name=wms
server.port=8080

# MySQL
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DB:0}
spring.data.redis.password=${REDIS_PASSWORD:}

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# PageHelper
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true
pagehelper.support-methods-arguments=true

# 文件上传
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
file.upload-path=${FILE_UPLOAD_PATH:/app/uploads}
file.upload-dir=${FILE_UPLOAD_PATH:/app/uploads}
file.base-url=${FILE_BASE_URL:}

# 图片存储
image.storage.path=${IMAGE_STORAGE_PATH:/app/uploads/images}
image.base-url=${IMAGE_BASE_URL:}
image.max-size=5MB
image.allowed-types=jpg,jpeg,png,gif,webp

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# AI 服务
ai.service.base-url=${AI_SERVICE_BASE_URL:http://wms-ai-service:8010}
ai.service.token=${AI_SERVICE_TOKEN:ChangeMeAiServiceToken}

# 数据库备份
backup.mysqldump-path=${BACKUP_MYSQLDUMP_PATH:mysqldump}

# Knife4j（Docker 环境默认关闭）
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
knife4j.enable=${SWAGGER_ENABLED:false}

# 日志
logging.level.com.yiweilai.wms=${LOG_LEVEL:info}
logging.level.com.yiweilai.wms.mapper=warn

# OCR
ocr.baidu.enabled=${OCR_ENABLED:false}
ocr.baidu.api-key=${OCR_API_KEY:}
ocr.baidu.secret-key=${OCR_SECRET_KEY:}

# 快递100
express.kuaidi100.enabled=${EXPRESS_ENABLED:false}
express.kuaidi100.key=${EXPRESS_KEY:}
express.kuaidi100.customer=${EXPRESS_CUSTOMER:}

# Privacy
privacy.crypto.enabled=true
privacy.crypto.algorithm=AES_256_GCM
privacy.crypto.key-id=${PRIVACY_KEY_ID:v1}
privacy.crypto.master-key=${PRIVACY_MASTER_KEY:P3HBjvkFvIi7Q/MOLgHA32Fgx8eutYLL3sqMmTKKLE8=}
privacy.crypto.hash-key=${PRIVACY_HASH_KEY:Td7H0vwQxi59YCQ8TpZXWpMiyS/lFadx2PMdQnLKuyU=}
