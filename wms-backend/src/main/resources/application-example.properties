spring.application.name=wms
server.port=8080

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/wms?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

pagehelper.helper-dialect=mysql
pagehelper.reasonable=true
pagehelper.support-methods-arguments=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
file.upload-path=${FILE_UPLOAD_PATH:./uploads}
file.upload-dir=${FILE_UPLOAD_PATH:./uploads}
file.base-url=${FILE_BASE_URL:http://localhost:8080}

jwt.secret=${JWT_SECRET:ChangeMeToLongRandomSecretForWmsJwtTokenGeneration}
jwt.expiration=${JWT_EXPIRATION:86400000}

ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8010}
ai.service.token=${AI_SERVICE_TOKEN:ChangeMeAiServiceToken}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
knife4j.enable=true

logging.level.com.yiweilai.wms=info
logging.level.com.yiweilai.wms.mapper=warn

ocr.baidu.enabled=false
ocr.baidu.api-key=${BAIDU_OCR_API_KEY:}
ocr.baidu.secret-key=${BAIDU_OCR_SECRET_KEY:}

express.kuaidi100.enabled=false
express.kuaidi100.key=${KUAIDI100_KEY:}
express.kuaidi100.customer=${KUAIDI100_CUSTOMER:}
