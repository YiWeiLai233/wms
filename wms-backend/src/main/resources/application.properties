spring.application.name=wms
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://192.168.199.136:3306/wms?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Gw.12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# PageHelper
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true
pagehelper.support-methods-arguments=true

# 文件上传
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
file.upload-path=${FILE_UPLOAD_PATH:./uploads}
file.upload-dir=${FILE_UPLOAD_PATH:./uploads}
file.base-url=${FILE_BASE_URL:http://localhost:8080}

# 图片存储配置
image.storage.path=${IMAGE_STORAGE_PATH:./uploads/images}
image.base-url=${IMAGE_BASE_URL:http://localhost:8080/images}
image.max-size=5MB
image.allowed-types=jpg,jpeg,png,gif,webp

# JWT
jwt.secret=${JWT_SECRET:ChangeMeToLongRandomSecretForWmsJwtTokenGeneration}
jwt.expiration=${JWT_EXPIRATION:86400000}

# AI service
ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8010}
ai.service.token=${AI_SERVICE_TOKEN:ChangeMeAiServiceToken}

# Knife4j
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
knife4j.enable=true

# 日志
logging.level.com.yiweilai.wms=info
logging.level.com.yiweilai.wms.mapper=warn

# OCR配置
# 百度OCR（需要申请：https://ai.baidu.com/tech/ocr）
ocr.baidu.enabled=false
ocr.baidu.api-key=your-api-key
ocr.baidu.secret-key=your-secret-key

# 快递100配置（可选，不配置也能使用其他功能）
# 申请地址：https://api.kuaidi100.com/
express.kuaidi100.enabled=false
express.kuaidi100.key=your-api-key
express.kuaidi100.customer=your-customer

# Privacy crypto local keys - do not commit this file.
privacy.crypto.enabled=true
privacy.crypto.algorithm=AES_256_GCM
privacy.crypto.key-id=v1
